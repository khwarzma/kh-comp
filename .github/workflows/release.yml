name: Build and Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SETUPTOOLS_VERSION: "72.1.0"
  PYBIND11_VERSION: "2.12.1"
  CIBW_VERSION: "2.21.0"

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==${{ env.SETUPTOOLS_VERSION }}" "pybind11>=${{ env.PYBIND11_VERSION }}" "cibuildwheel>=${{ env.CIBW_VERSION }}"

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.21.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "universal2"
          CIBW_ARCHS_WINDOWS: "AMD64"
          
          CIBW_BEFORE_BUILD: |
            pip install --upgrade pip
            pip install "setuptools==${{ env.SETUPTOOLS_VERSION }}" "pybind11>=${{ env.PYBIND11_VERSION }}" numpy
          
          CIBW_ENVIRONMENT: |
            CROSS_COMPILING=1
            CFLAGS="-O3 -fPIC"
            CXXFLAGS="-O3 -fPIC -std=c++23"
          
          CIBW_ENVIRONMENT_MACOS: |
            CROSS_COMPILING=1
            ARCHFLAGS="-arch arm64 -arch x86_64"
            LDFLAGS="-arch arm64 -arch x86_64"
            CFLAGS="-O3 -fPIC"
            CXXFLAGS="-O3 -fPIC -std=c++23"
          
          CIBW_ENVIRONMENT_WINDOWS: |
            CROSS_COMPILING=0
            CFLAGS="/O2 /permissive-"
            CXXFLAGS="/O2 /permissive- /std:c++latest"
          
          CIBW_TEST_COMMAND: |
            python -c "import khcomp; print(f'khcomp loaded: {khcomp.__name__}')"
          
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build[uv]>=1.0" "setuptools==${{ env.SETUPTOOLS_VERSION }}" "pybind11>=${{ env.PYBIND11_VERSION }}"

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startswith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          name: sdist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true