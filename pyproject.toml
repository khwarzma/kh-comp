[build-system]
requires = [
    "setuptools==72.1.0",
    "wheel",
    "pybind11>=2.12.1,<3.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "khcomp"
version = "0.1.0"
description = "Zero-Allocation High-Throughput Media and Data Compression Engine in C++23"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["compression", "audio", "video", "image", "arithmetic-coding", "cpp23", "pybind11"]
authors = [
    { name = "IM4", email = "im4@bareeed.com" },
    { name = "khwarzma", email = "khwarzma@bareeed.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving :: Compression"
]
dependencies = [
    "numpy>=1.23.0; python_version>='3.10'",
    "numpy>=1.23.0,<2.0; python_version=='3.10'",
    "numpy>=1.24.0,<2.0; python_version=='3.11'",
    "numpy>=1.26.0,<2.0; python_version=='3.12'"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
dev = [
    "setuptools-scm[toml]>=7.1",
    "build[uv]>=1.0"
]

[tool.setuptools]
packages = ["khcomp"]
include-package-data = true

[tool.setuptools.package-data]
khcomp = ["_native.pyi", "py.typed", "*.so", "*.pyd", "*.dylib"]